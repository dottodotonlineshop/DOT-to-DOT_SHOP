<script>
  // ------------------------------------------
  // 1. 全域 UI 控制函式
  // ------------------------------------------
  function switchPage(pageId) {
    document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
    document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));

    const targetSec = document.getElementById('page-' + pageId);
    const targetBtn = document.getElementById('btn-' + pageId);
    if (targetSec) targetSec.classList.add('active');
    if (targetBtn) targetBtn.classList.add('active');

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toggleCartDrawer(open) {
    const drawer = document.getElementById('cart-drawer');
    const overlay = document.getElementById('cart-overlay');
    if (drawer && overlay) {
      if (open) {
        drawer.classList.add('active');
        overlay.classList.add('active');
      } else {
        drawer.classList.remove('active');
        overlay.classList.remove('active');
      }
    }
  }

  function toggleNotificationPopover(e) {
    if (e) e.stopPropagation();
    const popover = document.getElementById('bell-popover');
    if (popover) popover.classList.toggle('active');
  }

  function markAllNotificationsRead() {
    const popover = document.getElementById('bell-popover');
    const badge = document.getElementById('bell-badge');
    if (badge) {
      badge.style.display = 'none';
      badge.textContent = '0';
    }
    if (currentUser) {
      localStorage.setItem('dottodot_read_notifs_' + currentUser.userId, 'true');
    }
    if (popover) popover.classList.remove('active');
  }

  function openMemberModal() {
    const memModal = document.getElementById('member-modal');
    if (memModal) memModal.classList.add('active');
    syncOrdersFromSheet();
  }

  function closeMemberModal() {
    const memModal = document.getElementById('member-modal');
    if (memModal) memModal.classList.remove('active');
  }

  function openCheckoutModal() {
    if (cart.length === 0) {
      alert('購物車內尚無商品！');
      return;
    }

    if (currentUser) {
      try {
        const savedProfile = JSON.parse(localStorage.getItem('dottodot_profile_' + currentUser.userId) || '{}');
        const buyerName = document.getElementById('buyer-name');
        const buyerLine = document.getElementById('buyer-line');
        const buyerPhone = document.getElementById('buyer-phone');
        const buyerMethod = document.getElementById('buyer-ship-method');
        const buyerStore = document.getElementById('buyer-store');

        if (buyerName) buyerName.value = savedProfile.name || currentUser.displayName || '';
        if (buyerLine) buyerLine.value = currentUser.contactValue || (currentUser.provider === 'Google' ? 'dottodot.onlineshop@gmail.com' : currentUser.displayName);
        if (buyerPhone) buyerPhone.value = savedProfile.phone || '';
        if (buyerMethod && savedProfile.shipMethod) {
          buyerMethod.value = savedProfile.shipMethod;
        }
        updateShipInputUI('checkout');
        if (buyerStore) buyerStore.value = savedProfile.store || '';
      } catch (e) {
        updateShipInputUI('checkout');
      }
    } else {
      updateShipInputUI('checkout');
    }

    toggleCartDrawer(false);
    const chkModal = document.getElementById('checkout-modal');
    if (chkModal) chkModal.classList.add('active');
  }

  function closeCheckoutModal() {
    const chkModal = document.getElementById('checkout-modal');
    if (chkModal) chkModal.classList.remove('active');
  }

  function closeSuccessModal() {
    const modal = document.getElementById('order-success-modal');
    if (modal) modal.classList.remove('active');
  }

  function skipProfileSetup() {
    const modal = document.getElementById('profile-setup-modal');
    if (modal) modal.classList.remove('active');
  }

  function switchMemberTab(tab) {
    const tabProfBtn = document.getElementById('tab-btn-profile');
    const tabOrdBtn = document.getElementById('tab-btn-orders');
    const tabProf = document.getElementById('member-tab-profile');
    const tabOrd = document.getElementById('member-tab-orders');

    if (tabProfBtn) tabProfBtn.classList.toggle('active', tab === 'profile');
    if (tabOrdBtn) tabOrdBtn.classList.toggle('active', tab === 'orders');
    if (tabProf) tabProf.style.display = tab === 'profile' ? 'block' : 'none';
    if (tabOrd) tabOrd.style.display = tab === 'orders' ? 'block' : 'none';
  }

  // ------------------------------------------
  // 2. 常數與資料庫
  // ------------------------------------------
  const MY_LIFF_ID = "2011693279-1eGSgIL6"; 
  const GOOGLE_CLIENT_ID = "316886708858-jjj47jvpngr2t7lm4c6ht4meqpq81rt4.apps.googleusercontent.com";
  const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxC5-LhTrBBuILbCvFhRDTA4sHJIZmZAdEIixufZPNeg1myjApTmSe34CIVeGRgmQ/exec";
  const OFFICIAL_LINE_ID = "@154bkwlh"; 
  const OFFICIAL_THREADS_URL = "https://www.threads.net";

  const DEFAULT_SERIES = [
    {

      seriesName: '日本原宿限定系列',
      img: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500&q=80',
      eta: '預計 14-21 天抵台出貨',
      items: [

        { name: '原宿街頭重磅連帽衛衣', price: 2180, colors: ['極光灰', '經典黑', '大地棕'], sizes: ['M', 'L', 'XL'] },
        { name: '金屬扣環編織鑰匙圈', price: 590, colors: ['電鍍銀', '啞光黑'], sizes: ['單一規格 (F)'] }
      ]
    },
    {
      id: 's2',
      seriesName: '海外官方限定公仔與周邊系列',
      img: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&q=80',
      eta: '預購品：預計 6-8 個月後抵台發貨',
      items: [
        { name: '1/7 比例限量收藏手辦公仔', price: 4800, colors: ['初回預約特典版', '一般通常版'], sizes: ['全高約25cm'] },
        { name: '特製壓克力角色立牌', price: 420, colors: ['A款 主視覺', 'B款 戰鬥姿態'], sizes: ['單一規格 (F)'] }
      ]
    },
    {

      img: 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500&q=80',
      eta: '預計 10-14 天抵台出貨',

        { name: '高磅數復古厚底老爹運動鞋', price: 2450, colors: ['白灰拼色', '黑白撞色', '全黑機能'], sizes: ['23.0cm', '24.0cm', '25.0cm', '26.5cm', '27.5cm'] }

    },

      items: [

      ]
    }
  ];

  let cart = [];
  let currentUser = null;
  let currentGasWebhook = localStorage.getItem('dottodot_gas_webhook') || GAS_WEBHOOK_URL;
  let productSeriesData = JSON.parse(localStorage.getItem('dottodot_custom_series')) || DEFAULT_SERIES;

  document.addEventListener('click', (e) => {
    const popover = document.getElementById('bell-popover');
    const bellBtn = document.getElementById('bell-btn');
    if (popover && popover.classList.contains('active')) {
      if (!popover.contains(e.target) && !bellBtn.contains(e.target)) {
        popover.classList.remove('active');
      }
    }
  });

  // ------------------------------------------
  // 3. 商品與購物車功能
  // ------------------------------------------
  function renderProducts() {
    const container = document.getElementById('product-grid-container');
    if (!container) return;

    container.innerHTML = productSeriesData.map(s => {
      const firstItem = s.items[0];
      return `
        <div class="product-card" id="card-${s.id}">
          <div class="product-img-wrap">
            <span class="preorder-badge">PRE-ORDER</span>
            <img src="${s.img}" alt="${s.seriesName}">
          </div>
          <div class="product-content">
            <div class="product-series">${s.seriesName}</div>
            <div class="product-eta">⏱ ${s.eta}</div>

            <div style="margin-bottom: 10px;">
              <label class="spec-label">選取品項：</label>
              <select class="spec-select" id="item-select-${s.id}" onchange="handleItemChange('${s.id}')">
                ${s.items.map((it, idx) => `<option value="${idx}">${it.name}</option>`).join('')}
              </select>
            </div>

            <div class="form-row-spec">
              <div class="spec-field">
                <label class="spec-label">顏色 / 款式：</label>
                <select class="spec-select" id="color-select-${s.id}">
                  ${firstItem.colors.map(c => `<option value="${c}">${c}</option>`).join('')}
                </select>
              </div>
              <div class="spec-field">
                <label class="spec-label">尺寸 / 規格：</label>
                <select class="spec-select" id="size-select-${s.id}">
                  ${firstItem.sizes.map(sz => `<option value="${sz}">${sz}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="product-foot">
              <div class="product-price" id="price-display-${s.id}">NT$ ${firstItem.price.toLocaleString()}</div>
              <button class="add-cart-btn" onclick="addToCart('${s.id}')">加入購物車</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function handleItemChange(seriesId) {
    const series = productSeriesData.find(x => x.id === seriesId);
    if (!series) return;

    const itemIdx = parseInt(document.getElementById(`item-select-${seriesId}`).value, 10);
    const item = series.items[itemIdx];

    document.getElementById(`price-display-${seriesId}`).textContent = `NT$ ${item.price.toLocaleString()}`;

    const colorSelect = document.getElementById(`color-select-${seriesId}`);
    colorSelect.innerHTML = item.colors.map(c => `<option value="${c}">${c}</option>`).join('');

    const sizeSelect = document.getElementById(`size-select-${seriesId}`);
    sizeSelect.innerHTML = item.sizes.map(sz => `<option value="${sz}">${sz}</option>`).join('');
  }

  function addToCart(seriesId) {
    const series = productSeriesData.find(x => x.id === seriesId);
    if (!series) return;

    const itemIdx = parseInt(document.getElementById(`item-select-${seriesId}`).value, 10);
    const item = series.items[itemIdx];

    const selectedColor = document.getElementById(`color-select-${seriesId}`).value;
    const selectedSize = document.getElementById(`size-select-${seriesId}`).value;
    const fullSpec = `${selectedColor} / ${selectedSize}`;

    cart.push({
      series: series.seriesName,
      name: `${series.seriesName} - ${item.name}`,
      itemName: item.name,
      price: item.price,
      spec: fullSpec,
      eta: series.eta,
      img: series.img,
      cartItemId: Date.now() + Math.random()
    });

    updateCartDisplay();
    toggleCartDrawer(true);
  }

  function removeCartItem(cartItemId) {
    cart = cart.filter(i => i.cartItemId !== cartItemId);
    updateCartDisplay();
  }

  function updateCartDisplay() {
    const cartCounter = document.getElementById('cart-counter');
    const drawerCount = document.getElementById('drawer-count');
    if (cartCounter) cartCounter.textContent = cart.length;
    if (drawerCount) drawerCount.textContent = cart.length;

    const container = document.getElementById('cart-items-container');
    if (!container) return;

    if (cart.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">
          <p style="font-size: 15px; font-weight: 700;">購物車目前是空的</p>
          <p style="font-size: 12px; margin-top: 6px;">請前往 SHOP ALL 選購預購商品</p>
        </div>
      `;
      const subtotal = document.getElementById('cart-subtotal');
      const total = document.getElementById('cart-total');
      if (subtotal) subtotal.textContent = 'NT$ 0';
      if (total) total.textContent = 'NT$ 0';
      return;
    }

    let total = 0;
    container.innerHTML = cart.map(item => {
      total += item.price;
      return `
        <div class="cart-item">
          <img src="${item.img}" class="cart-item-img" alt="">
          <div class="cart-item-info">
            <div class="cart-item-title">${item.itemName || item.name}</div>
            <div style="font-size: 11px; color:#555;">系列：${item.series}</div>
            <div class="cart-item-spec">規格：${item.spec}</div>
            <div class="cart-item-eta">進度：${item.eta}</div>
            <div class="cart-item-price">NT$ ${item.price.toLocaleString()}</div>
          </div>
          <button class="cart-item-del" onclick="removeCartItem(${item.cartItemId})">刪除</button>
        </div>
      `;
    }).join('');

    const subtotalEl = document.getElementById('cart-subtotal');
    const totalEl = document.getElementById('cart-total');
    if (subtotalEl) subtotalEl.textContent = `NT$ ${total.toLocaleString()}`;
    if (totalEl) totalEl.textContent = `NT$ ${total.toLocaleString()}`;
  }

  function updateShipInputUI(context) {
    let selectId, labelId, inputId;
    if (context === 'checkout') {
      selectId = 'buyer-ship-method';
      labelId = 'buyer-address-label';
      inputId = 'buyer-store';
    } else if (context === 'setup') {
      selectId = 'setup-ship-method';
      labelId = 'setup-address-label';
      inputId = 'setup-store';
    } else {
      selectId = 'profile-ship-method';
      labelId = 'profile-address-label';
      inputId = 'profile-store';
    }

    const selectEl = document.getElementById(selectId);
    const label = document.getElementById(labelId);
    const input = document.getElementById(inputId);
    if (!selectEl || !label || !input) return;

    const method = selectEl.value;
    if (method === 'home') {
      label.textContent = context === 'checkout' ? '完整宅配收件地址 *' : '常用預設宅配地址 (選填)';
      input.placeholder = '例如：台北市信義區忠孝東路五段XX號X樓';
    } else {
      label.textContent = context === 'checkout' ? '收件 7-11 門市名稱與店號 *' : '常用預設超商與門市 (選填)';
      input.placeholder = '例如：7-11 鑫東門市 (123456)';
    }
  }

  // ------------------------------------------
  // 4. 會員與訂單同步邏輯
  // ------------------------------------------
  function handleUserLoggedIn(user, isFirstTime) {
    currentUser = user;

    const avatarSlot = document.getElementById('user-avatar-slot');
    if (avatarSlot) {
      if (user.pictureUrl) {
        avatarSlot.innerHTML = `<img src="${user.pictureUrl}" alt="${user.displayName}">`;
      } else {
        avatarSlot.innerHTML = user.displayName.charAt(0);
      }
    }

    const unlogged = document.getElementById('auth-unlogged');
    const logged = document.getElementById('auth-logged');
    if (unlogged) unlogged.style.display = 'none';
    if (logged) logged.style.display = 'block';

    const dispName = document.getElementById('user-display-name');
    const dispId = document.getElementById('user-display-id');
    if (dispName) dispName.textContent = `${user.displayName} (${user.provider})`;
    if (dispId) dispId.textContent = user.contactValue || (user.provider === 'Google' ? 'dottodot.onlineshop@gmail.com' : 'LINE ID: ' + user.userId);

    const profPic = document.getElementById('user-profile-pic');
    if (profPic && user.pictureUrl) {
      profPic.src = user.pictureUrl;
    }

    try {
      const savedProfile = JSON.parse(localStorage.getItem('dottodot_profile_' + user.userId) || '{}');
      const profName = document.getElementById('profile-name');
      const profPhone = document.getElementById('profile-phone');
      const profMethod = document.getElementById('profile-ship-method');
      const profStore = document.getElementById('profile-store');

      if (profName && savedProfile.name) profName.value = savedProfile.name;
      if (profPhone && savedProfile.phone) profPhone.value = savedProfile.phone;
      if (profMethod && savedProfile.shipMethod) {
        profMethod.value = savedProfile.shipMethod;
        updateShipInputUI('profile');
      }
      if (profStore && savedProfile.store) profStore.value = savedProfile.store;

      if (isFirstTime && (!savedProfile.name && !savedProfile.phone)) {
        closeMemberModal();
        const setupName = document.getElementById('setup-real-name');
        const setupModal = document.getElementById('profile-setup-modal');
        if (setupName) setupName.value = user.displayName || '';
        if (setupModal) setupModal.classList.add('active');
      }
    } catch (e) {}

    syncOrdersFromSheet();
  }

  async function syncOrdersFromSheet() {
    if (!currentUser || !currentGasWebhook) return;
    
    const queryParam = encodeURIComponent(currentUser.contactValue || currentUser.displayName);
    const nameParam = encodeURIComponent(currentUser.displayName || '');
    const fetchUrl = `${currentGasWebhook}?contact=${queryParam}&name=${nameParam}`;

    try {
      const resp = await fetch(fetchUrl);
      const data = await resp.json();
      if (data && data.orders) {
        localStorage.setItem('dottodot_orders_' + currentUser.userId, JSON.stringify(data.orders));
        renderMemberOrders(data.orders);
        buildBellNotifications(data.orders);
      }
    } catch (err) {
      try {
        const localOrders = JSON.parse(localStorage.getItem('dottodot_orders_' + currentUser.userId) || '[]');
        renderMemberOrders(localOrders);
      } catch (e) {}
    }
  }

  function buildBellNotifications(orders) {
    if (!orders || orders.length === 0) return;
    
    let notifItems = [];
    orders.forEach(order => {
      if (order.payStatus && order.payStatus !== "尚未對帳") {
        notifItems.push({
          type: 'pay',
          title: `訂單 ${order.orderId} 對帳更新`,
          desc: `狀態已更新為：【${order.payStatus}】`
        });
      }
      order.items.forEach(item => {
        if (item.trackingNo || (item.shipStatus && item.shipStatus !== "等待到貨")) {
          notifItems.push({
            type: 'ship',
            title: `📦 ${item.name} 出貨進度`,
            desc: `狀態：${item.shipStatus}${item.trackingNo ? ' (單號: ' + item.trackingNo + ')' : ''}`
          });
        }
        if (item.payBatchNo || (item.procureStatus && item.procureStatus !== "未採購")) {
          notifItems.push({
            type: 'procure',
            title: `✈️ ${item.name} 採購進度`,
            desc: `狀態：${item.procureStatus}${item.payBatchNo ? ' (批次: ' + item.payBatchNo + ')' : ''}`
          });
        }
      });
    });

    const popoverContent = document.getElementById('bell-popover-content');
    const badge = document.getElementById('bell-badge');

    if (notifItems.length > 0 && popoverContent && badge) {
      popoverContent.innerHTML = notifItems.map(n => `
        <div class="pop-item ${n.type === 'ship' ? 'ship' : ''}">
          <strong style="color:${n.type === 'ship' ? '#06C755' : 'var(--primary-blue)'};">● ${n.title}</strong>
          <div style="margin-top: 2px;">${n.desc}</div>
        </div>
      `).join('');

      const isRead = localStorage.getItem('dottodot_read_notifs_' + currentUser.userId);
      if (!isRead) {
        badge.textContent = notifItems.length;
        badge.style.display = 'flex';
      }
    }
  }

  function handleSaveProfile(e, mode) {
    e.preventDefault();
    if (!currentUser) return;

    let name, phone, shipMethod, store;
    if (mode === 'setup') {
      name = document.getElementById('setup-real-name').value.trim();
      phone = document.getElementById('setup-phone').value.trim();
      shipMethod = document.getElementById('setup-ship-method').value;
      store = document.getElementById('setup-store').value.trim();
    } else {
      name = document.getElementById('profile-name').value.trim();
      phone = document.getElementById('profile-phone').value.trim();
      shipMethod = document.getElementById('profile-ship-method').value;
      store = document.getElementById('profile-store').value.trim();
    }

    const profileData = { name, phone, shipMethod, store };
    localStorage.setItem('dottodot_profile_' + currentUser.userId, JSON.stringify(profileData));

    const profName = document.getElementById('profile-name');
    const profPhone = document.getElementById('profile-phone');
    const profMethod = document.getElementById('profile-ship-method');
    const profStore = document.getElementById('profile-store');
    if (profName) profName.value = name;
    if (profPhone) profPhone.value = phone;
    if (profMethod) profMethod.value = shipMethod;
    updateShipInputUI('profile');
    if (profStore) profStore.value = store;

    const setupModal = document.getElementById('profile-setup-modal');
    if (setupModal) setupModal.classList.remove('active');
    alert('常用收件資料已儲存！');
  }

  function renderMemberOrders(ordersList) {
    if (!currentUser) return;
    const listContainer = document.getElementById('member-orders-list');
    if (!listContainer) return;

    let allOrders = ordersList;
    if (!allOrders) {
      try {
        allOrders = JSON.parse(localStorage.getItem('dottodot_orders_' + currentUser.userId) || '[]');
      } catch (e) {
        allOrders = [];
      }
    }

    if (allOrders.length === 0) {
      listContainer.innerHTML = `
        <div style="text-align:center; padding:30px 10px; color:var(--text-muted);">
          <p style="font-weight:700;">目前尚無歷史訂單</p>
          <p style="font-size:12px; margin-top:4px;">前往 SHOP ALL 下單預購品即可在此即時追蹤</p>
        </div>
      `;
      return;
    }

    listContainer.innerHTML = allOrders.map(order => `
      <div style="border:1.5px solid var(--border-color); border-radius:12px; padding:14px; margin-bottom:12px; ${order.isClosed ? 'background:#f8fafc;' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-muted); margin-bottom:8px; border-bottom:1px dashed #eee; padding-bottom:6px;">
          <span>編號：<b style="color:#111;">${order.orderId}</b></span>
          <div>
            ${order.isClosed ? '<span class="admin-badge-closed" style="margin-right:4px;">● 已結案</span>' : ''}
            <span style="background:#eff6ff; color:var(--primary-blue); font-weight:800; padding:2px 8px; border-radius:4px;">
              對帳：${order.payStatus || '尚未對帳'}
            </span>
          </div>
        </div>

        ${order.items.map(item => `
          <div style="background:#fafbff; border-radius:8px; padding:10px; margin-bottom:8px; font-size:13px; border:1px solid #f0f3f8;">
            <div style="display:flex; justify-content:space-between; font-weight:800; margin-bottom:2px;">
              <span>${item.name}</span>
              <span style="color:var(--primary-blue);">NT$ ${Number(item.price).toLocaleString()}</span>
            </div>
            <div style="font-size:11px; color:#777; margin-bottom:4px;">系列：${item.series || '海外代購選品'}</div>
            <div style="font-size:11.5px; color:#555; margin-bottom:6px;">規格：${item.spec}</div>
            
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <span style="background:#eef2ff; color:#4338ca; font-size:11px; font-weight:700; padding:2px 7px; border-radius:4px;">
                採購：${item.procureStatus \vert{}\vert{} '未採購'}${item.payBatchNo ? ' (' + item.payBatchNo + ')' : ''}
              </span>
              <span style="background:${item.shipStatus === '已寄出' ? '#e6f9ed' : '#fef3c7'}; color:${item.shipStatus === '已寄出' ? '#06C755' : '#b45309'}; font-size:11px; font-weight:700; padding:2px 7px; border-radius:4px;">
                出貨：${item.shipStatus \vert{}\vert{} '等待到貨'}${item.trackingNo ? ' (' + item.trackingNo + ')' : ''}
              </span>
            </div>
          </div>
        `).join('')}

        <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-top:8px; color:var(--text-muted);">
          <span>${order.shipMethod} ➜ ${order.buyerStore}</span>
          <span style="font-size:14px; font-weight:900; color:var(--primary-blue);">
            同單總金額：NT$ ${Number(order.totalAmount).toLocaleString()}
          </span>
        </div>
      </div>
    `).join('');
  }

  function handleLogout() {
    localStorage.removeItem('dottodot_user');
    if (typeof liff !== 'undefined' && liff.isLoggedIn()) liff.logout();
    window.location.reload();
  }

  function copyOrderDetails() {
    const textarea = document.getElementById('order-text-content');
    if (!textarea) return;
    textarea.select();
    textarea.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(textarea.value).then(() => {
      alert('📋 訂單明細已成功複製！請直接貼上傳送給官方 LINE 或 Threads 客服。');
    }).catch(() => {
      document.execCommand('copy');
      alert('📋 訂單明細已成功複製！');
    });
  }

  // ------------------------------------------
  // 5. 訂單結帳送出
  // ------------------------------------------
  async function handleOrderSubmit(e) {
    e.preventDefault();

    const buyerName = document.getElementById('buyer-name').value.trim();
    const buyerContact = document.getElementById('buyer-line').value.trim();
    const buyerPhone = document.getElementById('buyer-phone').value.trim();
    const buyerShipMethod = document.getElementById('buyer-ship-method').value;
    const buyerStore = document.getElementById('buyer-store').value.trim();
    const buyerNote = document.getElementById('buyer-note').value.trim();

    if (!buyerName || !buyerPhone || !buyerStore) {
      const targetDesc = buyerShipMethod === 'home' ? '宅配收件地址' : '超商門市名稱與店號';
      alert(`⚠️ 下單必填提醒：真實姓名、電話與${targetDesc}皆為必填項目！`);
      return;
    }

    const submitBtn = document.getElementById('submit-order-btn');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = '訂單連動送出中...';
    }

    if (currentUser) {
      const profileData = { name: buyerName, phone: buyerPhone, shipMethod: buyerShipMethod, store: buyerStore };
      localStorage.setItem('dottodot_profile_' + currentUser.userId, JSON.stringify(profileData));
    }

    let totalAmount = 0;
    cart.forEach(i => totalAmount += i.price);

    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const tempOrderId = `ORD-${yy}${mm}` + String(Math.floor(100 + Math.random() * 900));

    const orderPayload = {
      orderDate: new Date().toLocaleString(),
      buyerName: buyerName,
      buyerContact: buyerContact,
      buyerPhone: buyerPhone,
      shipMethod: buyerShipMethod,
      buyerStore: buyerStore,
      buyerNote: buyerNote,
      totalAmount: totalAmount,
      buyerLineUserId: (currentUser && currentUser.lineUserId) ? currentUser.lineUserId : "",
      items: cart
    };

    let finalOrderId = tempOrderId;

    if (currentGasWebhook) {
      try {
        const resp = await fetch(currentGasWebhook, {
          method: 'POST',
          body: JSON.stringify(orderPayload)
        });
        const resData = await resp.json();
        if (resData && resData.orderId) finalOrderId = resData.orderId;
      } catch (err) {
        console.warn('Google 試算表連動：', err);
      }
    }

    let lineItemsText = cart.map((it, idx) => `${idx + 1}. [${it.series}] ${it.itemName || it.name} (${it.spec}) - NT$${it.price}`).join('\n');
    let orderFullText = `【DOT to DOT 預購委託單】\n` +
                        `訂單編號：${finalOrderId}\n` +
                        `買家姓名：${buyerName}\n` +
                        `手機號碼：${buyerPhone}\n` +
                        `配送方式：${buyerShipMethod === 'home' ? '宅配' : '7-11'} (${buyerStore})\n` +
                        `同單總金額：NT$ ${totalAmount.toLocaleString()}\n` +
                        `---------------------\n` +
                        `品項明細：\n${lineItemsText}\n` +
                        `備註：${buyerNote || '無'}\n` +
                        `已下單完畢，煩請確認對帳，謝謝！`;

    const textContent = document.getElementById('order-text-content');
    if (textContent) textContent.value = orderFullText;

    const encodedMsg = encodeURIComponent(orderFullText);
    const directLineLink = `https://line.me/R/oaMessage/%40154bkwlh/?${encodedMsg}`;
    const lineDirectEl = document.getElementById('line-direct-link');
    if (lineDirectEl) lineDirectEl.href = directLineLink;

    const threadsEl = document.getElementById('threads-direct-link');
    if (threadsEl) threadsEl.href = OFFICIAL_THREADS_URL;

    const successId = document.getElementById('success-order-id');
    const successTot = document.getElementById('success-order-total');
    if (successId) successId.textContent = finalOrderId;
    if (successTot) successTot.textContent = `NT$ ${totalAmount.toLocaleString()}`;

    cart = [];
    updateCartDisplay();
    closeCheckoutModal();
    document.getElementById('order-form').reset();

    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = '確認送出預購單';
    }

    const succModal = document.getElementById('order-success-modal');
    if (succModal) succModal.classList.add('active');

    if (currentUser) {
      setTimeout(syncOrdersFromSheet, 1500);
    }
  }

  function promptAdminLogin() {
    const pwd = prompt('請輸入賣家後台管理員密碼：');
    if (pwd === ADMIN_PASSWORD) {
      switchPage('admin');
      loadAdminOrders();
    } else if (pwd !== null) {
      alert('密碼錯誤！無法進入賣家管理後台。');
    }
  }

  function exitAdminMode() {
    switchPage('shop');
    alert('已退出賣家管理後台。');
  }

  function handleAdminAddProduct(e) {
    e.preventDefault();
    const seriesName = document.getElementById('adm-series-name').value.trim();
    const img = document.getElementById('adm-series-img').value.trim();
    const eta = document.getElementById('adm-series-eta').value.trim();
    const itemName = document.getElementById('adm-item-name').value.trim();
    const itemPrice = parseInt(document.getElementById('adm-item-price').value, 10);
    const colors = document.getElementById('adm-item-colors').value.split(',').map(s => s.trim()).filter(Boolean);
    const sizes = document.getElementById('adm-item-sizes').value.split(',').map(s => s.trim()).filter(Boolean);

    const newSeries = {
      id: 'custom_' + Date.now(),
      seriesName: seriesName,
      img: img,
      eta: eta,
      items: [
        { name: itemName, price: itemPrice, colors: colors, sizes: sizes }
      ]
    };

    productSeriesData.unshift(newSeries);
    localStorage.setItem('dottodot_custom_series', JSON.stringify(productSeriesData));
    renderProducts();
    alert(`🎉 商品系列【${seriesName}】已成功上架！前往前台 SHOP ALL 即可選購。`);
    e.target.reset();
  }

  let adminOrdersList = [];
  async function loadAdminOrders() {
    const container = document.getElementById('admin-orders-container');
    if (!container) return;
    container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">載入試算表資料中...</div>';

    try {
      const resp = await fetch(`${currentGasWebhook}?admin=true`);
      const data = await resp.json();
      adminOrdersList = data.orders || [];
      renderAdminOrdersUI();
    } catch (err) {
      container.innerHTML = `<div style="color:red; padding:20px;">載入失敗：${err.message}</div>`;
    }
  }

  function renderAdminOrdersUI() {

    if (!container) return;

    if (adminOrdersList.length === 0) {
      container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">目前尚無任何訂單紀錄。</div>';
      return;
    }

    container.innerHTML = adminOrdersList.map((ord, ordIdx) => `
      <div class="admin-card ${ord.isClosed ? 'closed-order' : ''}" id="admin-card-${ord.orderId}">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:10px; margin-bottom:12px;">
          <div>
            <span style="font-size:16px; font-weight:900;">${ord.orderId}</span>
            <span style="font-size:12px; color:#64748b; margin-left:8px;">(${ord.orderDate})</span>
            ${ord.isClosed ? '<span class="admin-badge-closed" style="margin-left:6px;">● 已結案</span>' : ''}
            ${ord.buyerLineUserId ? '<span style="background:#e6f9ed; color:#06C755; font-size:11px; font-weight:800; padding:2px 6px; border-radius:4px; margin-left:4px;">LINE 已綁定 (可推播)</span>' : '<span style="background:#fef3c7; color:#b45309; font-size:11px; font-weight:800; padding:2px 6px; border-radius:4px; margin-left:4px;">Google/社群用戶</span>'}
          </div>
          <div>
            <label style="font-size:12px; font-weight:800; margin-right:4px;">對帳狀態：</label>
            <select class="form-select" style="width:auto; display:inline-block; padding:4px 8px; font-size:12px;" id="adm-paystatus-${ord.orderId}" ${ord.isClosed ? 'disabled' : ''}>
              <option value="尚未對帳" ${ord.payStatus === '尚未對帳' ? 'selected' : ''}>尚未對帳</option>
              <option value="已對帳 (款項確認)" ${ord.payStatus === '已對帳 (款項確認)' ? 'selected' : ''}>已對帳 (款項確認)</option>
              <option value="部分退款" ${ord.payStatus === '部分退款' ? 'selected' : ''}>部分退款</option>
            </select>
          </div>
        </div>

        <div style="font-size:13px; color:#334155; margin-bottom:10px;">
          買家：<b>${ord.buyerName}</b> ｜ 聯絡方式：<b>${ord.buyerContact}</b> ｜ 電話：${ord.buyerPhone}<br>
          配送：${ord.shipMethod} ➜ ${ord.buyerStore} ｜ 備註：${ord.buyerNote || '無'}
        </div>

        <div style="background:#f1f5f9; padding:10px; border-radius:10px; margin-bottom:12px;">
          <div style="font-weight:800; font-size:12.5px; margin-bottom:6px;">📦 拆單品項出貨/採購狀態維護：</div>
          ${ord.items.map((it, itemIdx) => `
            <div style="background:#ffffff; border-radius:8px; padding:10px; margin-bottom:8px; border:1px solid #cbd5e1;">
              <div style="display:flex; justify-content:space-between; font-weight:800; font-size:13px; margin-bottom:4px;">
                <span>${it.name} <span style="font-size:11px; color:#64748b;">(${it.spec})</span></span>
                <span style="color:var(--primary-blue);">NT$ ${Number(it.price).toLocaleString()}</span>
              </div>

                  <input type="text" class="form-input" style="padding:6px; font-size:12px;" id="adm-payno-${ord.orderId}-${itemIdx}" value="${it.payBatchNo \vert{}\vert{} ''}" placeholder="例: BATCH-01" ${ord.isClosed ? 'disabled' : ''}>

                  <select class="form-select" style="padding:6px; font-size:12px;" id="adm-procure-${ord.orderId}-${itemIdx}" ${ord.isClosed ? 'disabled' : ''}>
                    <option value="未採購" ${it.procureStatus === '未採購' ? 'selected' : ''}>未採購</option>

  async function adminSubmitStatus(orderId, ordIdx, shouldNotify) {
    const ord = adminOrdersList[ordIdx];
    const payStatus = document.getElementById(`adm-paystatus-${orderId}`).value;

    const confirmMsg = shouldNotify 
      ? `確定要儲存狀態並發送最新動態給買家 (${ord.buyerContact}) 嗎？${ord.buyerLineUserId ? '\n(系統將自動推播至買家的個人 LINE 聊天室)' : ''}`
      : `確定要儲存狀態嗎？`;

    if (!confirm(confirmMsg)) return;

    for (let i = 0; i < ord.items.length; i++) {
      const payNo = document.getElementById(`adm-payno-${orderId}-${i}`).value.trim();
      const procStatus = document.getElementById(`adm-procure-${orderId}-${i}`).value;
      const trackNo = document.getElementById(`adm-trackno-${orderId}-${i}`).value.trim();
      const shipStatus = document.getElementById(`adm-ship-${orderId}-${i}`).value;

      const payload = {
        action: "updateStatus",
        orderId: orderId,
        itemName: ord.items[i].name,
        buyerName: ord.buyerName,
        buyerContact: ord.buyerContact,
        payBatchNo: payNo,
        procureStatus: procStatus,
        trackingNo: trackNo,
        shipStatus: shipStatus,
        payStatus: payStatus,
        shouldNotify: shouldNotify
      };

      try {
        await fetch(currentGasWebhook, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.warn("更新失敗：", e);
      }
    }

    alert(`✅ 訂單 ${orderId} 狀態已正式同步至試算表！${shouldNotify ? '（推播通知已發送）' : ''}`);
    loadAdminOrders();
  }

  async function adminToggleCloseOrder(orderId, ordIdx, setClose) {
    const actionName = setClose ? "確認結案" : "取消結案";
    if (!confirm(`確定要將訂單 ${orderId} 進行【${actionName}】嗎？${setClose ? '結案後將無法再發送通知給客人。' : '取消結案後將恢復發送權限。'}`)) {
      return;
    }

    const payload = {
      action: "updateStatus",
      orderId: orderId,
      isClosed: setClose,
      shouldNotify: false
    };

    try {
      await fetch(currentGasWebhook, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      alert(`已成功將訂單 ${orderId} 設定為：${setClose ? '【已結案】' : '【處理中 (可編輯)】'}`);
      loadAdminOrders();
    } catch (e) {
      alert("操作失敗，請檢查網路連線。");
    }
  }

  // ------------------------------------------
  // 7. 頁面開機初始化
  // ------------------------------------------
  window.addEventListener('DOMContentLoaded', () => {
    renderProducts();
    updateCartDisplay();

    try {
      const savedUser = localStorage.getItem('dottodot_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        handleUserLoggedIn(currentUser, false);
      } else {
        initLiffSafe();
      }
    } catch (e) {}

    initGoogleSafe();
  });

  function initGoogleSafe() {
    try {
      if (window.google && window.google.accounts) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredentialResponse
        });
      }
    } catch (e) {}
  }

  function initLiffSafe() {
    try {
      if (typeof liff !== 'undefined') {
        liff.init({ liffId: MY_LIFF_ID }).then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              const userObj = {
                provider: 'LINE',
                displayName: profile.displayName,
                userId: profile.userId,
                lineUserId: profile.userId,
                contactValue: profile.displayName,
                pictureUrl: profile.pictureUrl
              };
              localStorage.setItem('dottodot_user', JSON.stringify(userObj));
              handleUserLoggedIn(userObj, true);
            });
          }
        }).catch(() => {});
      }
    } catch (e) {}
  }

  function loginWithLine() {
    try {
      if (typeof liff !== 'undefined') {
        if (!liff.isLoggedIn()) liff.login();
      } else {
        alert("LINE SDK 仍在載入中，請稍候重試。");
      }
    } catch (e) {}
  }

  function loginWithGoogle() {
    try {
      if (window.google && window.google.accounts) {
        google.accounts.id.prompt();
      } else {
        alert("Google 登入功能載入中，請稍候重試。");
      }
    } catch (e) {}
  }

  function handleGoogleCredentialResponse(response) {
    try {
      const payload = JSON.parse(decodeURIComponent(escape(atob(response.credential.split('.')[1]))));
      const realEmail = payload.email || "dottodot.onlineshop@gmail.com";

      const userObj = {
        provider: 'Google',
        displayName: payload.name,
        userId: payload.sub,
        lineUserId: '',
        contactValue: realEmail,
        pictureUrl: payload.picture
      };
      localStorage.setItem('dottodot_user', JSON.stringify(userObj));
      handleUserLoggedIn(userObj, true);
    } catch (e) {}
  }
